services:
  db:
    image: postgres:16
    container_name: showroom_db
    environment:
      POSTGRES_DB: showroom
      POSTGRES_USER: showroom
      POSTGRES_PASSWORD: showroom
    # Reserved local host port for ShowRoomPrive PostgreSQL.
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showroom -d showroom"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: showroom_api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://showroom:showroom@db:5432/showroom
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./playwright/.auth:/app/playwright/.auth
      - ./artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars are inlined at build time — override via .env or CLI:
        # NEXT_PUBLIC_API_URL=https://api.example.com docker compose up --build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: showroom_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Uncomment to run scraper as a standalone CLI loop (cron managed by API by default)
  # app:
  #   build: .
  #   container_name: showroom_agent
  #   entrypoint: ["python", "-m", "src.app"]
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file: .env

volumes:
  pgdata:
